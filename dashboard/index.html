<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GSC 本地控制台</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; background: #F4F3EE; color: #252522; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 60px; }
  .kicker { font-size: 11px; color: #888780; letter-spacing: .4px; }
  h1 { font-size: 21px; margin: 4px 0 2px; }
  .temp { font-size: 11px; color: #888780; margin: 0 0 22px; }
  h2 { font-size: 14px; margin: 26px 0 10px; }
  .form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px; background: #fff; border: 1px solid #E3E1D8; border-radius: 10px; }
  input, select { font: inherit; padding: 6px 10px; border: 1px solid #D8D5CA; border-radius: 8px; background: #fff; }
  input[type=text] { flex: 1; min-width: 160px; }
  input[type=number] { width: 82px; }
  button { font: inherit; padding: 6px 14px; border: 1px solid #B4B2A9; border-radius: 999px; background: #fff; cursor: pointer; }
  button:hover { background: #EFEDE4; }
  button.primary { background: #252522; color: #fff; border-color: #252522; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #fff; border: 1px solid #E3E1D8; border-radius: 10px; margin-bottom: 8px; }
  .chip { flex: none; font-size: 11px; padding: 2px 10px; border-radius: 999px; background: #EEEDFE; color: #534AB7; }
  .chip.web { background: #FAEEDA; color: #854F0B; }
  .body { flex: 1; min-width: 0; }
  .body b { font-weight: 600; }
  .meta { font-size: 11px; color: #888780; }
  .empty { color: #888780; padding: 14px 2px; }
  .toast { position: fixed; right: 18px; bottom: 18px; background: #252522; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 12px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 60vw; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">本地控制台（临时）</div>
  <h1>持续采集调度</h1>
  <p class="temp">temporary · 本地模拟云端拓扑（db/api/worker 同构）· 独立 dashboard，不属于 GSC 页面</p>

  <h2>添加调度</h2>
  <div class="form">
    <input id="name" type="text" placeholder="名称" />
    <select id="kind">
      <option value="folder">文件夹</option>
      <option value="web">网页源</option>
    </select>
    <input id="path" type="text" placeholder="文件夹绝对路径（只读扫描）" />
    <input id="interval" type="number" min="1" value="5" title="间隔（分钟）" />
    <button class="primary" id="create">创建</button>
  </div>

  <h2>调度列表</h2>
  <div id="list"><div class="empty">加载中…</div></div>

  <h2>识别管线（META_TAG_PIPELINE）</h2>
  <div class="form">
    <button class="primary" id="detect">运行全量识别</button>
    <span class="meta">五维轮：dedupe / association / metadata / meta_tag 建议 / tag discovery · 全走提案制</span>
  </div>
  <div id="detectReport" class="empty">尚未运行（LLM 维状态随 /api/llm/config 而定；401 时仅规则维产出）</div>
  <h2>待裁决提案（按维度）</h2>
  <div id="propCounts"><div class="empty">加载中…</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
  const $ = (id) => document.getElementById(id);
  const toast = (msg) => {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2600);
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function refresh() {
    try {
      const r = await fetch('/api/schedules');
      const d = await r.json();
      const rows = d.schedules ?? [];
      if (!rows.length) { $('list').innerHTML = '<div class="empty">暂无调度</div>'; return; }
      $('list').innerHTML = rows.map((s) => `
        <div class="row">
          <span class="chip ${s.kind === 'web' ? 'web' : ''}">${s.kind === 'folder' ? '文件夹' : '网页源'}</span>
          <span class="body">
            <b>${esc(s.name)}</b>
            <div class="meta">
              ${s.kind === 'folder' ? esc(s.root_path) : (s.url_list.split('\n').filter(Boolean).length + ' URL')}
              · 每 ${s.interval_min} 分钟
              · ${s.last_run_at ? '上次 ' + esc(s.last_run_at.slice(5, 16).replace('T', ' ')) : '从未运行'}
              ${s.status === 'running' ? ' · 运行中' : ''}
            </div>
          </span>
          <button data-act="toggle" data-id="${s.id}" data-on="${s.enabled}">${s.enabled ? '停用' : '启用'}</button>
          <button data-act="run" data-id="${s.id}" ${s.status === 'running' ? 'disabled' : ''}>立即运行</button>
          <button data-act="del" data-id="${s.id}">删除</button>
        </div>`).join('');
    } catch (e) {
      $('list').innerHTML = '<div class="empty">API 不可达（8788）</div>';
    }
  }

  $('kind').addEventListener('change', () => {
    $('path').placeholder = $('kind').value === 'folder' ? '文件夹绝对路径（只读扫描）' : 'URL 列表（每行一条）';
  });

  $('create').addEventListener('click', async () => {
    const name = $('name').value.trim();
    if (!name) { toast('请填名称'); return; }
    const kind = $('kind').value;
    const body = { name, kind, interval_min: Number($('interval').value) || 5 };
    if (kind === 'folder') body.root_path = $('path').value.trim();
    else body.url_list = $('path').value;
    const r = await fetch('/api/schedules', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    if (r.ok) { toast('调度已创建'); $('name').value = ''; $('path').value = ''; refresh(); }
    else { const d = await r.json().catch(() => ({})); toast(d.message || '创建失败'); }
  });

  $('list').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const id = b.dataset.id;
    const act = b.dataset.act;
    b.disabled = true;
    try {
      if (act === 'toggle') {
        await fetch('/api/schedules/' + id, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ enabled: b.dataset.on !== 'true' }) });
        toast('已切换');
      } else if (act === 'run') {
        const r = await fetch('/api/schedules/' + id + '/run', { method: 'POST' });
        const d = await r.json().catch(() => ({}));
        toast(r.ok ? '已运行：' + (d.detail || '') : (d.message || '运行失败'));
      } else if (act === 'del') {
        await fetch('/api/schedules/' + id, { method: 'DELETE' });
        toast('已删除');
      }
    } finally {
      refresh();
    }
  });

  const KIND_LABEL = { dedupe: '去重', association: '关联', metadata: '元信息', meta_tag: '打标建议', pending_definition: '新标签定义', cluster: '归块', semantic_name: '语义命名', classification: '分类' };

  async function refreshProps() {
    try {
      const r = await fetch('/api/proposals?status=pending');
      const d = await r.json();
      const counts = {};
      for (const p of (d.proposals ?? [])) counts[p.kind] = (counts[p.kind] ?? 0) + 1;
      const entries = Object.entries(counts);
      $('propCounts').innerHTML = entries.length
        ? entries.map(([k, v]) => `<div class="row"><span class="chip">${esc(KIND_LABEL[k] || k)}</span><span class="body"><b>${v}</b> 条待裁决</span></div>`).join('')
        : '<div class="empty">暂无待裁决提案</div>';
    } catch (e) {
      $('propCounts').innerHTML = '<div class="empty">API 不可达</div>';
    }
  }

  $('detect').addEventListener('click', async () => {
    const b = $('detect');
    b.disabled = true; b.textContent = '识别中…';
    try {
      const r = await fetch('/api/agent/detect', { method: 'POST' });
      const d = await r.json();
      if (d.ok) {
        const rep = d.report ?? {};
        $('detectReport').innerHTML = `<div class="row"><span class="body">
          <b>上次识别报告</b>
          <div class="meta">dedupe ${rep.dedupe ?? 0} · metadata ${rep.metadata ?? 0} · association ${rep.association ?? 0} · meta_tag ${rep.meta_tag ?? 0} · discovered ${rep.discovered ?? 0}（候选 ${rep.candidates ?? 0}）· LLM 状态：${rep.llm ?? '-'}</div>
        </span></div>`;
        toast('识别完成：提案已入待裁决');
      } else {
        toast(d.message || '识别失败');
      }
      refreshProps();
    } catch (e) {
      toast('识别失败：API 不可达');
    } finally {
      b.disabled = false; b.textContent = '运行全量识别';
    }
  });

  refresh();
  refreshProps();
  setInterval(refresh, 15000);
  setInterval(refreshProps, 20000);
</script>
</body>
</html>
